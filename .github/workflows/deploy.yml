name: PromoGuard CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: promoguard
          POSTGRES_USER: promoguard
          POSTGRES_PASSWORD: promoguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend với Maven
        run: |
          cd PromoGuard-BE
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner for Docker Tag
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./PromoGuard-BE
          file: ./PromoGuard-BE/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/promoguard-be:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./PromoGuard-FE
          file: ./PromoGuard-FE/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/promoguard-fe:latest
          build-args: |
            VITE_API_URL=http://${{ secrets.VPS_HOST }}:8080
            VITE_KEYCLOAK_URL=http://${{ secrets.VPS_HOST }}:8082

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy qua SSH vào VPS AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/promoguard
            
            # Tự động cập nhật IP VPS vào file .env
            echo "VPS_IP=${{ secrets.VPS_HOST }}" > .env
            
            # Cập nhật code và file docker-compose.yml mới nhất từ GitHub
            git pull origin main
            
            # Đăng nhập GHCR trên VPS để pull image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull image mới nhất của dịch vụ 'app' và 'frontend'
            docker compose --profile full pull app frontend
            
            # Khởi động toàn bộ hạ tầng (Postgres, Redis, Kafka, Keycloak...) và App, Frontend
            docker compose --profile full up -d
            
            # Xóa các image cũ để giải phóng dung lượng VPS
            docker image prune -f